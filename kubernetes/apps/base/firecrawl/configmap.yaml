apiVersion: v1
kind: ConfigMap
metadata:
  name: firecrawl-config
data:
  HOST: "0.0.0.0"
  PORT: "3002"
  WORKER_PORT: "3005"
  EXTRACT_WORKER_PORT: "3004"
  NUQ_WORKER_PORT: "3006"
  NUQ_PREFETCH_WORKER_PORT: "3011"
  NUM_WORKERS_PER_QUEUE: "8"
  NUQ_WORKER_COUNT: "2"
  USE_DB_AUTHENTICATION: "false"
  IS_KUBERNETES: "true"
  ENV: "production"
  LOGGING_LEVEL: "INFO"
  FIRECRAWL_APP_SCHEME: "http"
  FIRECRAWL_APP_HOST: "firecrawl-api"
  FIRECRAWL_APP_PORT: "3002"
  PLAYWRIGHT_MICROSERVICE_URL: "http://firecrawl-playwright:3000/scrape"
  # Must be "postgres": the ghcr.io/firecrawl/nuq-postgres image hardcodes
  # cron.database_name = 'postgres' in postgresql.conf.sample at build time
  # (see apps/nuq-postgres/Dockerfile upstream). pg_cron only allows
  # CREATE EXTENSION in the database matching cron.database_name, so nuq.sql's
  # init fails silently-past-initdb if POSTGRES_DB is anything else.
  POSTGRES_USER: "postgres"
  POSTGRES_DB: "postgres"
