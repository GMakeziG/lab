apiVersion: apps/v1
kind: Deployment
metadata:
  name: firecrawl-extract-worker
  labels:
    app: firecrawl-extract-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: firecrawl-extract-worker
  template:
    metadata:
      labels:
        app: firecrawl-extract-worker
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: extract-worker
          image: ghcr.io/firecrawl/firecrawl:2.11.701@sha256:3fe1263dbf79984af344475fb075c0a557e9c529146bd2619a3af6bea0f28904
          imagePullPolicy: IfNotPresent
          command: ["node"]
          args: ["--max-old-space-size=3072", "dist/src/services/extract-worker.js"]
          ports:
            - containerPort: 3004
          env:
            - name: FLY_PROCESS_GROUP
              value: "extract-worker"
            - name: NUQ_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          envFrom:
            - configMapRef:
                name: firecrawl-config
            - secretRef:
                name: firecrawl-secret
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /liveness
              port: 3004
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3004
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
