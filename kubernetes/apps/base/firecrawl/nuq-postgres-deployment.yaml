apiVersion: apps/v1
kind: Deployment
metadata:
  name: firecrawl-nuq-postgres
  labels:
    app: firecrawl-nuq-postgres
spec:
  # Single replica, PVC-backed, node-pinned: Recreate avoids two pods racing
  # for the same ReadWriteOnce local-path volume during a rollout.
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: firecrawl-nuq-postgres
  template:
    metadata:
      labels:
        app: firecrawl-nuq-postgres
    spec:
      # local-path storage is node-local; pin to niner so the PV location is
      # deterministic instead of left to scheduler discretion. This is a
      # single point of failure by design — no replication, no failover.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - niner
      containers:
        - name: nuq-postgres
          image: ghcr.io/firecrawl/nuq-postgres:linux-amd64@sha256:4ca6718b2cef40404b046db5cd37ae45db3e44d1a5750c80522f3587a5b193d5
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: firecrawl-config
            - secretRef:
                name: firecrawl-secret
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: firecrawl-nuq-postgres-pvc
