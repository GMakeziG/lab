apiVersion: apps/v1
kind: Deployment
metadata:
  name: firecrawl-rabbitmq
  labels:
    app: firecrawl-rabbitmq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: firecrawl-rabbitmq
  template:
    metadata:
      labels:
        app: firecrawl-rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3-management
          ports:
            - containerPort: 5672
            - containerPort: 15672
          envFrom:
            - secretRef:
                name: firecrawl-secret
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          livenessProbe:
            tcpSocket:
              port: 5672
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            tcpSocket:
              port: 5672
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
