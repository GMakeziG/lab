apiVersion: v1
kind: Service
metadata:
  name: firecrawl-rabbitmq
spec:
  type: ClusterIP
  selector:
    app: firecrawl-rabbitmq
  ports:
    - name: amqp
      protocol: TCP
      port: 5672
      targetPort: 5672
    - name: management
      protocol: TCP
      port: 15672
      targetPort: 15672
