apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo-postgres
  labels:
    app: forgejo-postgres
spec:
  # Single replica, PVC-backed, node-pinned: Recreate avoids two pods racing
  # for the same ReadWriteOnce local-path volume during a rollout.
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: forgejo-postgres
  template:
    metadata:
      labels:
        app: forgejo-postgres
    spec:
      # local-path storage is node-local; pin to niner so the PV location is
      # deterministic and lands on the same node as the Forgejo PVC. This is a
      # single point of failure by design -- no replication, no failover.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - niner
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:17.11-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_DB
              value: forgejo
            - name: POSTGRES_USER
              value: forgejo
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: forgejo-postgres-secret
                  key: POSTGRES_PASSWORD
            # initdb requires the data directory to be 0700, which it cannot
            # enforce on the fsGroup-owned mount root. Use a subdirectory.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "forgejo", "-d", "forgejo"]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "forgejo", "-d", "forgejo"]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: forgejo-postgres-data
