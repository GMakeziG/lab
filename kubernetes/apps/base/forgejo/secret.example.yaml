# Documents the Kubernetes Secret keys the Forgejo deployment expects.
# NOT applied by any kustomization -- the real Secrets are produced at runtime
# by the ExternalSecrets in kubernetes/apps/production/forgejo/external-secrets,
# which read OpenBao at secret/apps/forgejo (remoteRef key: apps/forgejo).
#
# OpenBao property          -> Kubernetes Secret        -> key
# ------------------------- -- ------------------------ -- -----------------
# database-password         -> forgejo-postgres-secret  -> POSTGRES_PASSWORD
# admin-username            -> forgejo-admin-secret     -> username
# admin-password            -> forgejo-admin-secret     -> password
# secret-key                -> forgejo-security-secret  -> SECRET_KEY
# internal-token            -> forgejo-security-secret  -> INTERNAL_TOKEN
# jwt-secret                -> forgejo-security-secret  -> JWT_SECRET
# lfs-jwt-secret            -> forgejo-security-secret  -> LFS_JWT_SECRET
---
apiVersion: v1
kind: Secret
metadata:
  name: forgejo-postgres-secret
type: Opaque
stringData:
  # Consumed by the postgres container (POSTGRES_PASSWORD) and by Forgejo as
  # FORGEJO__DATABASE__PASSWD.
  POSTGRES_PASSWORD: "REPLACE_WITH_SECRET"
---
apiVersion: v1
kind: Secret
metadata:
  name: forgejo-admin-secret
type: Opaque
stringData:
  # Key names are fixed by the chart (gitea.admin.existingSecret reads
  # literally `username` and `password`).
  username: "REPLACE_WITH_SECRET"
  password: "REPLACE_WITH_SECRET"
---
apiVersion: v1
kind: Secret
metadata:
  name: forgejo-security-secret
type: Opaque
stringData:
  # Seeded into app.ini on first boot only. Forgejo generates its own values
  # if these are absent, but then they exist nowhere but the PVC.
  SECRET_KEY: "REPLACE_WITH_SECRET"
  INTERNAL_TOKEN: "REPLACE_WITH_SECRET"
  JWT_SECRET: "REPLACE_WITH_SECRET"
  LFS_JWT_SECRET: "REPLACE_WITH_SECRET"
