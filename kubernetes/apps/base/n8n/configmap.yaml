apiVersion: v1
kind: ConfigMap
metadata:
  name: n8n-config
data:
  N8N_PORT: "5678"
  N8N_PROTOCOL: "https"
  N8N_HOST: "n8n.ninjatronics.io"
  N8N_EDITOR_BASE_URL: "https://n8n.ninjatronics.io/"
  N8N_WEBHOOK_URL: "https://n8n.ninjatronics.io/"
  N8N_PROXY_HOPS: "1"
  GENERIC_TIMEZONE: "America/Los_Angeles"
  TZ: "America/Los_Angeles"
  N8N_SECURE_COOKIE: "true"
  N8N_DIAGNOSTICS_ENABLED: "false"
  N8N_PERSONALIZATION_ENABLED: "false"
