apiVersion: v1
kind: ConfigMap
metadata:
  name: n8n-config
data:
  N8N_PORT: "5678"
  N8N_PROTOCOL: "http"
  N8N_HOST: "n8n.ninjatronics.home.arpa"
  N8N_EDITOR_BASE_URL: "http://n8n.ninjatronics.home.arpa"
  WEBHOOK_URL: "http://n8n.ninjatronics.home.arpa/"
  GENERIC_TIMEZONE: "America/Los_Angeles"
  TZ: "America/Los_Angeles"
  N8N_SECURE_COOKIE: "false"
  N8N_DIAGNOSTICS_ENABLED: "false"
  N8N_PERSONALIZATION_ENABLED: "false"
