apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
spec:
  replicas: 1

  selector:
    matchLabels:
      app: n8n

  strategy:
    type: Recreate

  template:
    metadata:
      labels:
        app: n8n

    spec:
      containers:
        - name: n8n
          image: docker.n8n.io/n8nio/n8n:2.38.3

          ports:
            - name: http
              containerPort: 5678
              protocol: TCP

          envFrom:
            - configMapRef:
                name: n8n-config
            - secretRef:
                name: n8n-secret

          volumeMounts:
            - name: n8n-data
              mountPath: /home/node/.n8n

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi

      volumes:
        - name: n8n-data
          persistentVolumeClaim:
            claimName: n8n-data
