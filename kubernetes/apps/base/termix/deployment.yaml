apiVersion: apps/v1
kind: Deployment
metadata:
  name: termix
  labels:
    app.kubernetes.io/name: termix
spec:
  replicas: 1
  # SQLite: the upstream chart's validate.yaml refuses more than one replica,
  # and /app/data is a ReadWriteOnce local-path volume.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: termix
  template:
    metadata:
      labels:
        app.kubernetes.io/name: termix
      annotations:
        # envFrom does not roll the pod when termix-config changes, and an
        # imperative `kubectl rollout restart` is reverted by Flux on its next
        # reconcile. Bump this whenever configmap.yaml changes so the new
        # environment is picked up declaratively.
        lab/config-revision: "3"
    spec:
      serviceAccountName: termix
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: niner
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # guacd only sees the recordings directory, mounted via subPath. If
        # that directory does not exist kubelet creates it non-writable for
        # uid 1000, so create it here first, as uid 1000, on the full volume.
        - name: recordings-dir
          image: ghcr.io/lukegus/termix:release-2.7.0@sha256:be6080b9d4b282984bd9ffc280d1d9fd30b22539adb33853c44d783343c83d33
          imagePullPolicy: IfNotPresent
          command: ["mkdir", "-p", "/app/data/session_recordings/guacamole"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: data
              mountPath: /app/data
      containers:
        - name: termix
          image: ghcr.io/lukegus/termix:release-2.7.0@sha256:be6080b9d4b282984bd9ffc280d1d9fd30b22539adb33853c44d783343c83d33
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            # Must stay false. docker/entrypoint.sh renders the nginx config
            # into /tmp/nginx and unconditionally rewrites /app/html/**/sw.js
            # with sed -i on every start, so the image root filesystem is
            # written to before the backend comes up. Both paths are inside
            # the image (owned by uid/gid 1000), not on the data volume, so
            # an emptyDir cannot substitute for write access here.
            readOnlyRootFilesystem: false
          envFrom:
            - configMapRef:
                name: termix-config
            - secretRef:
                name: termix-secret
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          # /health is served by nginx on 8080 and proxied to the backend on
          # loopback 30001. The backend ports (30001-30012) stay loopback-only
          # and are deliberately not exposed by the Service.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /app/data
        # Remote-desktop proxy for RDP/VNC/Telnet. Runs as the image's own
        # guacd user (uid/gid 1000, same as Termix). The image entrypoint
        # hardcodes `-b 0.0.0.0`, so guacd is invoked directly to keep it
        # loopback-only: only the termix container in this pod can reach it.
        - name: guacd
          image: guacamole/guacd:1.6.0@sha256:8974eaa9ba32f713daf311e7cc8cd7e4cdfba1edea39eed75524e78ef4b08f4f
          imagePullPolicy: IfNotPresent
          command: ["/opt/guacamole/sbin/guacd"]
          args: ["-f", "-b", "127.0.0.1", "-l", "4822", "-L", "info"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          # Loopback-only, so a tcpSocket probe (which targets the pod IP)
          # would always fail. nc is the check the image's own HEALTHCHECK uses.
          readinessProbe:
            exec:
              command: ["nc", "-z", "127.0.0.1", "4822"]
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["nc", "-z", "127.0.0.1", "4822"]
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            # Only the recordings directory, at the path Termix passes to
            # guacd as recording-path; never the database or keys.
            - name: data
              mountPath: /app/data/session_recordings/guacamole
              subPath: session_recordings/guacamole
            # FreeRDP keeps its config and certificate store under $HOME.
            - name: guacd-home
              mountPath: /home/guacd
            - name: guacd-tmp
              mountPath: /tmp
            # Termix sets drive-path=/drive for RDP hosts with drive
            # redirection enabled (routes.ts:620). Ephemeral by design.
            - name: guacd-drive
              mountPath: /drive
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: termix-data
        - name: guacd-home
          emptyDir:
            sizeLimit: 64Mi
        - name: guacd-tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: guacd-drive
          emptyDir:
            sizeLimit: 1Gi
