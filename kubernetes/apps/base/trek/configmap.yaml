apiVersion: v1
kind: ConfigMap
metadata:
  name: trek-config
  labels:
    app.kubernetes.io/name: trek
data:
  NODE_ENV: "production"
  PORT: "3000"
  TZ: "America/Los_Angeles"
  LOG_LEVEL: "info"

  # Public base URL of this instance. Used for e-mail/notification links, the
  # MCP resource URL, and the WebAuthn relying-party ID. Changing it later
  # invalidates every registered passkey, so it is set to the final hostname
  # now even though Phase 1 is internal-only.
  APP_URL: "https://trek.ninjatronics.io"

  # CORS allow-list. In production TREK sets `origin: false` (same-origin only)
  # when this is unset (server/src/middleware/globalMiddleware.ts:105-116);
  # naming the host explicitly keeps behaviour identical if that default ever
  # changes. Must stay in sync with the Ingress host.
  ALLOWED_ORIGINS: "https://trek.ninjatronics.io"

  # Traefik terminates TLS and is the single proxy hop in front of TREK.
  # Required for X-Forwarded-Proto to be honoured, which is what makes the
  # `Secure` session cookie and the audit log's client IP correct.
  TRUST_PROXY: "1"

  # FORCE_HTTPS is deliberately NOT set. Traefik already terminates TLS and the
  # websecure entrypoint is the only one this Ingress binds, so the in-app 301
  # would be redundant. HSTS is emitted anyway whenever NODE_ENV=production
  # (server/src/middleware/globalMiddleware.ts:129), so nothing is lost.

  # COOKIE_SECURE is deliberately NOT set. With NODE_ENV=production the session
  # cookie is `Secure` automatically (server/src/nest/common/cookie.ts:33-37).
  # This is why Phase 1 must be reached over real HTTPS and not a plain-HTTP
  # port-forward: a browser silently discards a Secure cookie sent over http://
  # and login fails with "Access token required".

  # No Immich, Synology Photos, AirTrail or LAN webhook integration is used, so
  # the SSRF guard stays closed to RFC-1918 destinations. Loopback and
  # link-local are blocked regardless of this value.
  ALLOW_INTERNAL_NETWORK: "false"

  # The plugin system is ON upstream by default
  # (server/src/app-config/derive.ts:201). It installs third-party code under
  # /app/data/plugins and forks child Node processes to run it
  # (server/src/nest/plugins/paths.ts:107). Upstream sandboxes this well, but it
  # is a code-execution surface this deployment has no use for. `false` is the
  # documented off switch (wiki/Security-Hardening.md).
  TREK_PLUGINS_ENABLED: "false"

  # Deliberately unset elsewhere in this deployment:
  #   JWT_SECRET             - TREK generates and owns it at /app/data/.jwt_secret
  #                            and rotates it from the admin panel. An env var
  #                            would override a rotation on the next restart
  #                            (server/src/config.ts:100-118).
  #   TREK_DB_JOURNAL_MODE   - WAL is the correct default on local disk. Only
  #                            NFS/SMB volumes need DELETE.
  #   TREK_MANAGED           - would LOCK allow_registration out of the admin UI
  #                            (server/src/nest/common/managed.ts:126), which is
  #                            the opposite of what Phase 1 needs.
  #   DEMO_MODE, OIDC_ONLY   - not applicable.
