apiVersion: v1
kind: Service
metadata:
  name: trek
  labels:
    app.kubernetes.io/name: trek
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: trek
  ports:
    # Serves the SPA, the REST API and the /ws WebSocket gateway on one port.
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
