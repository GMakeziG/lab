apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - pvc-images.yaml
  - pvc-data.yaml
  - postgres-deployment.yaml
  - postgres-service.yaml
  - postgres-pvc.yaml
  # secret.example.yaml is NOT applied -- it documents expected keys only.
  # The real Secret is produced at runtime by the ExternalSecret in the
  # production overlay, reading OpenBao at secret/apps/wallabag.
