# Documents the Kubernetes Secret keys the Wallabag deployment expects.
# NOT applied by any kustomization -- the real Secret is produced at runtime
# by the ExternalSecret in kubernetes/apps/production/wallabag/external-secrets,
# which reads OpenBao at secret/apps/wallabag (remoteRef key: apps/wallabag).
#
# OpenBao property     -> Kubernetes Secret key               -> Used by
# --------------------- -- ----------------------------------- -- --------------------------
# postgres-password    -> POSTGRES_PASSWORD                  -> PostgreSQL container (superuser)
# database-password    -> SYMFONY__ENV__DATABASE_PASSWORD    -> Wallabag (app database user)
# secret               -> SYMFONY__ENV__SECRET               -> Wallabag (Symfony secret)
---
apiVersion: v1
kind: Secret
metadata:
  name: wallabag-secret
type: Opaque
stringData:
  POSTGRES_PASSWORD: "REPLACE_WITH_SECRET"
  SYMFONY__ENV__DATABASE_PASSWORD: "REPLACE_WITH_SECRET"
  SYMFONY__ENV__SECRET: "REPLACE_WITH_SECRET"
