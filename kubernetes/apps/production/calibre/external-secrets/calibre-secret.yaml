# OpenBao KV v2 path: secret/apps/calibre
# ClusterSecretStore "openbao" already mounts the "secret" path.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: calibre-secret
  namespace: calibre
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: calibre-secret
    creationPolicy: Owner
  data:
    - secretKey: CALIBRE_USERNAME
      remoteRef:
        key: apps/calibre
        property: username
    - secretKey: CALIBRE_PASSWORD
      remoteRef:
        key: apps/calibre
        property: password
