apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: firecrawl-secret
  namespace: firecrawl
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: firecrawl-secret
    creationPolicy: Owner
    template:
      data:
        REDIS_URL: "redis://:{{ .REDIS_PASSWORD }}@firecrawl-redis:6379"
        REDIS_RATE_LIMIT_URL: "redis://:{{ .REDIS_PASSWORD }}@firecrawl-redis:6379"
        REDIS_PASSWORD: "{{ .REDIS_PASSWORD }}"
        NUQ_DATABASE_URL: "postgresql://postgres:{{ .NUQ_POSTGRES_PASSWORD }}@firecrawl-nuq-postgres:5432/postgres"
        NUQ_DATABASE_URL_LISTEN: "postgresql://postgres:{{ .NUQ_POSTGRES_PASSWORD }}@firecrawl-nuq-postgres:5432/postgres"
        NUQ_RABBITMQ_URL: "amqp://{{ .RABBITMQ_DEFAULT_USER }}:{{ .RABBITMQ_DEFAULT_PASS }}@firecrawl-rabbitmq:5672"
        POSTGRES_PASSWORD: "{{ .NUQ_POSTGRES_PASSWORD }}"
        RABBITMQ_DEFAULT_USER: "{{ .RABBITMQ_DEFAULT_USER }}"
        RABBITMQ_DEFAULT_PASS: "{{ .RABBITMQ_DEFAULT_PASS }}"
        BULL_AUTH_KEY: "{{ .BULL_AUTH_KEY }}"
  data:
    - secretKey: NUQ_POSTGRES_PASSWORD
      remoteRef:
        key: apps/firecrawl
        property: NUQ_POSTGRES_PASSWORD
    - secretKey: RABBITMQ_DEFAULT_USER
      remoteRef:
        key: apps/firecrawl
        property: RABBITMQ_DEFAULT_USER
    - secretKey: RABBITMQ_DEFAULT_PASS
      remoteRef:
        key: apps/firecrawl
        property: RABBITMQ_DEFAULT_PASS
    - secretKey: BULL_AUTH_KEY
      remoteRef:
        key: apps/firecrawl
        property: BULL_AUTH_KEY
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: apps/firecrawl
        property: REDIS_PASSWORD
