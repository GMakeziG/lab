# OpenBao path: secret/apps/forgejo
# ClusterSecretStore "openbao" is mounted at path "secret", so remoteRef.key
# is "apps/forgejo" -- NOT "apps/apps/forgejo".
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-postgres-secret
  namespace: forgejo
spec:
  refreshInterval: 1h

  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao

  target:
    name: forgejo-postgres-secret
    creationPolicy: Owner

  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: apps/forgejo
        property: database-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-admin-secret
  namespace: forgejo
spec:
  refreshInterval: 1h

  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao

  target:
    name: forgejo-admin-secret
    creationPolicy: Owner

  # Key names are fixed by the chart: gitea.admin.existingSecret reads
  # literally `username` and `password`.
  data:
    - secretKey: username
      remoteRef:
        key: apps/forgejo
        property: admin-username
    - secretKey: password
      remoteRef:
        key: apps/forgejo
        property: admin-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-security-secret
  namespace: forgejo
spec:
  refreshInterval: 1h

  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao

  target:
    name: forgejo-security-secret
    creationPolicy: Owner

  data:
    - secretKey: SECRET_KEY
      remoteRef:
        key: apps/forgejo
        property: secret-key
    - secretKey: INTERNAL_TOKEN
      remoteRef:
        key: apps/forgejo
        property: internal-token
    - secretKey: JWT_SECRET
      remoteRef:
        key: apps/forgejo
        property: jwt-secret
    - secretKey: LFS_JWT_SECRET
      remoteRef:
        key: apps/forgejo
        property: lfs-jwt-secret
