# OpenBao KV v2 path: secret/apps/termix
# ClusterSecretStore "openbao" already mounts the "secret" path, so
# remoteRef.key is "apps/termix" -- NOT "secret/apps/termix".
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: termix-secret
  namespace: termix
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: termix-secret
    creationPolicy: Owner
  data:
    - secretKey: JWT_SECRET
      remoteRef:
        key: apps/termix
        property: jwt-secret
    - secretKey: DATABASE_KEY
      remoteRef:
        key: apps/termix
        property: database-key
    - secretKey: ENCRYPTION_KEY
      remoteRef:
        key: apps/termix
        property: encryption-key
    - secretKey: INTERNAL_AUTH_TOKEN
      remoteRef:
        key: apps/termix
        property: internal-auth-token
