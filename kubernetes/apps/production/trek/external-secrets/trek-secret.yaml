# OpenBao KV v2 path: secret/apps/trek
# ClusterSecretStore "openbao" already mounts the "secret" path, so
# remoteRef.key is "apps/trek" -- NOT "secret/apps/trek".
#
# encryption-key is the only permanent secret material TREK needs at runtime.
# It derives the AES-256-GCM keys for everything TREK stores at rest (TOTP/MFA
# secrets, SMTP password, OIDC client secret, S3 keys, per-user API keys,
# share-link passphrases). Losing it makes all of them permanently unreadable.
# Never edit it in place -- rotation requires server/scripts/migrate-encryption.ts.
#
# Supplying it from the environment rather than letting TREK auto-generate one
# onto the data PVC also keeps backup archives from bundling the key
# (server/src/nest/backup/backup.impl.ts:257), which means a restore is
# incomplete without OpenBao.
#
# admin-email / admin-password were BOOTSTRAP-ONLY and have been removed.
# They were read only while the database had no users (server/src/db/seeds.ts:24-33)
# and were silently ignored on every boot after the first. The administrator now
# exists with a changed password and TOTP enrolled, and registration is closed,
# so they are no longer referenced by this deployment. Re-adding them would have
# no effect on an initialised instance -- the seeder logs a warning and skips.
#
# JWT_SECRET is deliberately absent. TREK generates and owns it at
# /app/data/.jwt_secret and rotates it from the admin panel; supplying it here
# would override a rotation on the next restart (server/src/config.ts:100-118).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: trek-secret
  namespace: trek
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: trek-secret
    creationPolicy: Owner
  data:
    - secretKey: ENCRYPTION_KEY
      remoteRef:
        key: apps/trek
        property: encryption-key
