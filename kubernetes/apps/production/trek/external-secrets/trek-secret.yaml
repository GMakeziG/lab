# OpenBao KV v2 path: secret/apps/trek
# ClusterSecretStore "openbao" already mounts the "secret" path, so
# remoteRef.key is "apps/trek" -- NOT "secret/apps/trek".
#
# Lifecycle note -- the three properties are NOT equivalent:
#
#   encryption-key  PERMANENT and recovery-critical. Derives the AES-256-GCM
#                   keys for every secret TREK stores at rest (TOTP/MFA
#                   secrets, SMTP password, OIDC client secret, S3 keys,
#                   per-user API keys, share-link passphrases). Losing it makes
#                   all of them permanently unreadable. Never edit it in place
#                   -- rotation requires server/scripts/migrate-encryption.ts.
#
#   admin-email     BOOTSTRAP-ONLY. Both are read only when the database has no
#   admin-password  users (server/src/db/seeds.ts:24-33) and are silently
#                   ignored on every later boot. They will be removed from this
#                   ExternalSecret in a separate follow-up change once the
#                   administrator has changed the bootstrap password,
#                   registration is disabled and TOTP is enrolled.
#
# JWT_SECRET is deliberately absent. TREK generates and owns it at
# /app/data/.jwt_secret and rotates it from the admin panel; supplying it here
# would override a rotation on the next restart (server/src/config.ts:100-118).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: trek-secret
  namespace: trek
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: trek-secret
    creationPolicy: Owner
  data:
    - secretKey: ENCRYPTION_KEY
      remoteRef:
        key: apps/trek
        property: encryption-key
    - secretKey: ADMIN_EMAIL
      remoteRef:
        key: apps/trek
        property: admin-email
    - secretKey: ADMIN_PASSWORD
      remoteRef:
        key: apps/trek
        property: admin-password
