# OpenBao path: secret/apps/wallabag
# ClusterSecretStore "openbao" is mounted at path "secret", so remoteRef.key
# is "apps/wallabag" -- NOT "apps/apps/wallabag".
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wallabag-secret
  namespace: wallabag
spec:
  refreshInterval: 1h

  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao

  target:
    name: wallabag-secret
    creationPolicy: Owner

  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: apps/wallabag
        property: postgres-password
    - secretKey: SYMFONY__ENV__DATABASE_PASSWORD
      remoteRef:
        key: apps/wallabag
        property: database-password
    - secretKey: SYMFONY__ENV__SECRET
      remoteRef:
        key: apps/wallabag
        property: secret
