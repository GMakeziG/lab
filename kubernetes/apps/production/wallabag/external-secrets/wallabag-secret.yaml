# OpenBao path: secret/apps/wallabag
# ClusterSecretStore "openbao" is mounted at path "secret", so remoteRef.key
# is "apps/wallabag" -- NOT "apps/apps/wallabag".
#
# POSTGRES_USER=wallabag makes the PostgreSQL superuser IS the Wallabag app
# user. Both POSTGRES_PASSWORD and SYMFONY__ENV__DATABASE_PASSWORD must be the
# same value because they authenticate the same PostgreSQL role. We use the
# "database-password" OpenBao property for both. The "postgres-password"
# property is not used (kept in OpenBao for reference; it was intended for a
# separate superuser but the superuser IS the app user in this architecture).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wallabag-secret
  namespace: wallabag
spec:
  refreshInterval: 1h

  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao

  target:
    name: wallabag-secret
    creationPolicy: Owner

  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: apps/wallabag
        property: database-password
    - secretKey: SYMFONY__ENV__DATABASE_PASSWORD
      remoteRef:
        key: apps/wallabag
        property: database-password
    - secretKey: SYMFONY__ENV__SECRET
      remoteRef:
        key: apps/wallabag
        property: secret
