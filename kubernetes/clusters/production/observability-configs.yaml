apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: observability-configs
  namespace: flux-system
spec:
  dependsOn:
    - name: observability-controllers
  interval: 10m
  path: ./kubernetes/observability/configs
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
