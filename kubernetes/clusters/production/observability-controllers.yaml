apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: observability-controllers
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure
  interval: 10m
  path: ./kubernetes/observability/controllers/production
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
